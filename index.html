<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Site — Gerador de Landing Pages</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
h1{font-size:clamp(36px,6vw,64px);font-weight:800;letter-spacing:-2px;margin-bottom:12px}
h1 span{color:#ff2222}
p{font-size:18px;color:#888;max-width:500px;margin-bottom:24px}
a.btn{display:inline-block;background:#ff2222;color:#fff;padding:14px 32px;border-radius:8px;text-decoration:none;font-weight:600;margin:6px}
a.btn:hover{opacity:.85}
a.ghost{background:transparent;border:2px solid #333;color:#e8e8e2}
code{display:block;background:#111;border:1px solid #222;border-radius:8px;padding:16px;margin:24px auto;max-width:500px;font-size:14px;color:#ff2222;text-align:left}
</style>
</head>
<body>
<h1>Quick <span>Site</span></h1>
<p>Gere uma landing page profissional para qualquer pequeno negócio — a partir de um JSON.</p>
<a class="btn" href="https://github.com/klcombr/quick-site">Ver no GitHub</a>
<a class="btn ghost" href="https://github.com/klcombr/quick-site#instalação">Como usar</a>
<code>python quick_site.py --config serralheria.json</code>
<p style="font-size:14px;color:#555;margin-top:40px">Feito por KL Com</p>
</body>
</html>
